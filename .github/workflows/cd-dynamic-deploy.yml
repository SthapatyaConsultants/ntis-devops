name: Dynamic Multi-Tenant Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (example: 1.0.0.0)'
        required: true
        type: string

      package_env:
        description: 'Package source environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      url:
        description: 'Tenant URL (example: ptisthane.scipl.info.in)'
        required: true
        type: string

env:
  PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
  CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}

jobs:

# =========================================================
# 1. PREPARE
# =========================================================
  prepare:
    name: 🔹 Load Tenant Configuration
    runs-on: [self-hosted, cd, ntis]

    outputs:
      ENV_NAME: ${{ steps.load.outputs.env }}
      TENANT_NAME: ${{ steps.load.outputs.tenant }}
      API_SITE: ${{ steps.load.outputs.api_site }}
      API_PATH: ${{ steps.load.outputs.api_path }}
      UI_PATH: ${{ steps.load.outputs.ui_path }}
      UI_SERVICE: ${{ steps.load.outputs.ui_service }}

    steps:

      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          repository: SthapatyaConsultants/ntis-configs
          token: ${{ secrets.PAT_TOKEN }}
          path: ntis-configs

      - name: Load Config From URL
        id: load
        shell: powershell
        run: |

          $url = "${{ github.event.inputs.url }}".ToLower()

          $configFile = "ntis-configs/tenants.json"

          if (!(Test-Path $configFile)) {
            Write-Error "tenants.json not found"
            exit 1
          }

          $json = Get-Content $configFile -Raw | ConvertFrom-Json

          $cfg = $json.$url

          if (-not $cfg) {
            Write-Error "No configuration found for URL: $url"
            exit 1
          }

          echo "env=$($cfg.environment)" >> $env:GITHUB_OUTPUT
          echo "tenant=$($cfg.tenant)" >> $env:GITHUB_OUTPUT
          echo "api_site=$($cfg.apiSite)" >> $env:GITHUB_OUTPUT
          echo "api_path=$($cfg.apiPath)" >> $env:GITHUB_OUTPUT
          echo "ui_path=$($cfg.uiPath)" >> $env:GITHUB_OUTPUT
          echo "ui_service=$($cfg.uiService)" >> $env:GITHUB_OUTPUT

          Write-Host "================================="
          Write-Host "URL         : $url"
          Write-Host "Environment : $($cfg.environment)"
          Write-Host "Tenant      : $($cfg.tenant)"
          Write-Host "API Site    : $($cfg.apiSite)"
          Write-Host "API Path    : $($cfg.apiPath)"
          Write-Host "UI Path     : $($cfg.uiPath)"
          Write-Host "UI Service  : $($cfg.uiService)"
          Write-Host "================================="


# =========================================================
# 2. VALIDATE ENVIRONMENT
# =========================================================
  validate:
    name: ✅ Validate Environment
    needs: prepare
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Validate Package Environment
        shell: powershell
        run: |

          $tenantEnv  = "${{ needs.prepare.outputs.ENV_NAME }}"
          $packageEnv = "${{ github.event.inputs.package_env }}"

          Write-Host "Tenant Environment : $tenantEnv"
          Write-Host "Package Environment: $packageEnv"

          if ($tenantEnv -ne $packageEnv) {

            Write-Error "Package environment does not match tenant environment"
            exit 1
          }

          Write-Host "Environment validation passed"


# =========================================================
# 3. DOWNLOAD PACKAGES
# =========================================================
  download:
    name: 📦 Download Packages
    needs: [prepare, validate]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Prepare Deploy Folder
        shell: powershell
        run: |

          Remove-Item "C:\Deploy" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path "C:\Deploy" `
            -Force | Out-Null

      - name: Download Packages
        shell: powershell
        run: |

          $v = "${{ github.event.inputs.version }}"
          $packageEnv = "${{ github.event.inputs.package_env }}"

          Write-Host "Package Source : $packageEnv"
          Write-Host "Version        : $v"

          # UI
          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$packageEnv/$v/ui/ntis-ui-$packageEnv-v$v.zip" `
            --file "C:\Deploy\ui.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

          # API
          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$packageEnv/$v/platform/ntis-platform-api-$packageEnv-v$v.zip" `
            --file "C:\Deploy\api.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

      - name: Extract Packages
        shell: powershell
        run: |

          Expand-Archive "C:\Deploy\ui.zip" `
            -DestinationPath "C:\Deploy\ui" -Force

          Expand-Archive "C:\Deploy\api.zip" `
            -DestinationPath "C:\Deploy\api" -Force


# =========================================================
# 4. STOP SERVICES + BACKUP
# =========================================================
  stop-backup:
    name: 🛑 Stop Services & Backup
    needs: [prepare, download]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Stop API Website & AppPool
        shell: powershell
        run: |

          Import-Module WebAdministration

          $site = "${{ needs.prepare.outputs.API_SITE }}"

          Write-Host "IIS Site: $site"

          $siteObject = Get-Website -Name $site -ErrorAction SilentlyContinue

          if (-not $siteObject) {
            Write-Error "IIS website '$site' does not exist."
            exit 1
          }

          # Get the actual Application Pool assigned to this IIS site.
          $pool = $siteObject.applicationPool

          if (-not $pool) {
            Write-Error "No Application Pool is assigned to IIS website '$site'."
            exit 1
          }

          Write-Host "Application Pool: $pool"

          Stop-Website -Name $site -ErrorAction Stop
          Stop-WebAppPool -Name $pool -ErrorAction Stop

          $timeout = 30
          $elapsed = 0

          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            $siteState = (Get-Website -Name $site).State
            $poolState = (Get-WebAppPoolState -Name $pool).Value
            Write-Host "Site: $siteState | AppPool: $poolState"
          } while (($siteState -ne "Stopped" -or $poolState -ne "Stopped") -and $elapsed -lt $timeout)

          if ($siteState -ne "Stopped" -or $poolState -ne "Stopped") {
            Write-Error "Failed to stop IIS Site/AppPool. Site=$siteState AppPool=$poolState"
            exit 1
          }

          Write-Host "IIS Site and AppPool stopped successfully."


      - name: Stop UI Service
        shell: powershell
        run: |

          $svc = "${{ needs.prepare.outputs.UI_SERVICE }}"

          $service = Get-Service -Name $svc -ErrorAction SilentlyContinue

          if (-not $service) {
            Write-Error "Windows service '$svc' does not exist."
            exit 1
          }

          if ($service.Status -ne "Stopped") {
            Stop-Service -Name $svc -Force -ErrorAction Stop
          }

          $timeout = 30
          $elapsed = 0

          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            $service.Refresh()
            Write-Host "Service State: $($service.Status)"
          } while ($service.Status -ne "Stopped" -and $elapsed -lt $timeout)

          if ($service.Status -ne "Stopped") {
            Write-Error "Service '$svc' did not stop. Current state: $($service.Status)"
            exit 1
          }

          Write-Host "UI Service stopped successfully."

      - name: Backup Existing Files
        shell: powershell
        run: |

          $tenant  = "${{ needs.prepare.outputs.TENANT_NAME }}"
          $envName = "${{ needs.prepare.outputs.ENV_NAME }}"

          $date = Get-Date -Format "yyyy-MM-dd"
          $time = Get-Date -Format "HH-mm-ss"

          $backupRoot = "C:\Backup\$tenant\$envName\$date\$time"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $backupRoot | Out-Null

          robocopy `
            "${{ needs.prepare.outputs.API_PATH }}" `
            "$backupRoot\API" `
            /MIR

          robocopy `
            "${{ needs.prepare.outputs.UI_PATH }}" `
            "$backupRoot\UI" `
            /MIR

          exit 0


# =========================================================
# 5. DEPLOY
# =========================================================
  deploy:
    name: 🚀 Deploy Application
    needs: [prepare, stop-backup]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Create Target Folders
        shell: powershell
        run: |

          New-Item -ItemType Directory `
            -Force `
            -Path "${{ needs.prepare.outputs.API_PATH }}" | Out-Null

          New-Item -ItemType Directory `
            -Force `
            -Path "${{ needs.prepare.outputs.UI_PATH }}" | Out-Null

      - name: Deploy API
        shell: powershell
        run: |

          robocopy `
            "C:\Deploy\api" `
            "${{ needs.prepare.outputs.API_PATH }}" `
            /E `
            /XF "appsettings.json" `
                "appsettings.Development.json" `
                "appsettings.Production.json" `
                "appsettings.Worker.json" `
            /XD "Uploads"

          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy Exit Code: $robocopyExitCode"

          if ($robocopyExitCode -le 7) {
            Write-Host "API deployment completed successfully."
            exit 0
          }

          Write-Error "API deployment failed. Robocopy exit code: $robocopyExitCode"
          exit $robocopyExitCode

      - name: Deploy UI
        shell: powershell
        run: |

          robocopy `
            "C:\Deploy\ui" `
            "${{ needs.prepare.outputs.UI_PATH }}" `
            /E `
            /XF "server.js" ".env" "web.config"

          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy Exit Code: $robocopyExitCode"

          if ($robocopyExitCode -le 7) {
            Write-Host "UI deployment completed successfully."
            exit 0
          }

          Write-Error "UI deployment failed. Robocopy exit code: $robocopyExitCode"
          exit $robocopyExitCode


# =========================================================
# 6. START SERVICES
# =========================================================
  start:
    name: 🟢 Start Services
    needs: [prepare, deploy]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Start API Website & AppPool
        shell: powershell
        run: |

          Import-Module WebAdministration

          $site = "${{ needs.prepare.outputs.API_SITE }}"

          $siteObject = Get-Website -Name $site -ErrorAction SilentlyContinue

          if (-not $siteObject) {
            Write-Error "IIS website '$site' does not exist."
            exit 1
          }

          $pool = $siteObject.applicationPool

          if (-not $pool) {
            Write-Error "No Application Pool is assigned to IIS website '$site'."
            exit 1
          }

          Write-Host "IIS Site: $site"
          Write-Host "Application Pool: $pool"

          Start-WebAppPool -Name $pool -ErrorAction Stop
          Start-Website -Name $site -ErrorAction Stop

          $timeout = 30
          $elapsed = 0

          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            $poolState = (Get-WebAppPoolState -Name $pool).Value
            $siteState = (Get-Website -Name $site).State
            Write-Host "AppPool: $poolState | Site: $siteState"
          } while (($poolState -ne "Started" -or $siteState -ne "Started") -and $elapsed -lt $timeout)

          if ($poolState -ne "Started" -or $siteState -ne "Started") {
            Write-Error "Failed to start IIS Site/AppPool. Site=$siteState AppPool=$poolState"
            exit 1
          }

          Write-Host "IIS Site and AppPool started successfully."


      - name: Start UI Service
        shell: powershell
        run: |

          $svc = "${{ needs.prepare.outputs.UI_SERVICE }}"

          $service = Get-Service `
            -Name $svc `
            -ErrorAction SilentlyContinue

          if ($service -and $service.Status -ne "Running") {

            sc start $svc
          }
