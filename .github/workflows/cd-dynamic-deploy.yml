# INTERIM manual deploy of existing version-numbered packages (plan Phase 0). Replaced by deploy-env.yml at
# cutover (plan 6.2) and deleted in 6.4.
# Phase 0 fixes: approval via <env>-manual (F32), single job + per-run folder (F17), host-wide concurrency (F18),
# backup must succeed (F30), automatic restore on failure (F19), DB migration restored (F20/F28),
# real service start/stop - no `sc` alias (F16), health check (F27), inputs validated and never inlined (F33),
# timeouts (F31). All deploy logic comes from scripts/NtisDeploy.psm1 (same code as the new pipeline).
name: Dynamic Multi-Tenant Deployment (interim)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (example: 1.0.0.0)'
        required: true
        type: string
      package_env:
        description: 'Package source environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      url:
        description: 'Tenant URL (example: ptisthane.scipl.info.in)'
        required: true
        type: string
      run_db_migration:
        description: 'Run DatabaseManager (U) before deploying the API'
        required: true
        type: boolean
        default: true
      skip_health_check:
        description: 'Skip the HTTP health check'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ntis-host-deploy
  cancel-in-progress: false

jobs:
  prepare:
    name: Load tenant
    runs-on: [self-hosted, cd, ntis]
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.load.outputs.environment }}
    steps:
      - name: Checkout ntis-devops
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout config repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: SthapatyaConsultants/ntis-configs
          token: ${{ secrets.PAT_TOKEN }}
          path: _configs

      - name: Validate inputs and tenant
        id: load
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_ENV: ${{ inputs.package_env }}
          TENANT_URL: ${{ inputs.url }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/NtisDeploy.psm1 -Force -DisableNameChecking
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version '$env:VERSION' (expected W.X.Y.Z)." }
          $t = Get-NtisTenant -TenantsFile '_configs/tenants.json' -Url $env:TENANT_URL
          if ($t.Environment -ne $env:PACKAGE_ENV) { throw "Tenant $($t.Url) is '$($t.Environment)' but package_env is '$env:PACKAGE_ENV'." }
          "environment=$($t.Environment)" >> $env:GITHUB_OUTPUT
          Write-Host "Tenant $($t.Url): env=$($t.Environment) site=$($t.ApiSite) api=$($t.ApiPath) ui=$($t.UiPath) service=$($t.UiService)"

      - if: always()
        shell: powershell
        run: Remove-Item _configs -Recurse -Force -ErrorAction SilentlyContinue

  deploy:
    name: Deploy ${{ inputs.url }}
    needs: prepare
    runs-on: [self-hosted, cd, ntis]
    timeout-minutes: 30
    # prod -> production-manual, qa -> qa-manual, dev -> dev-manual (required reviewers on production-manual)
    environment:
      name: ${{ needs.prepare.outputs.environment == 'prod' && 'production' || needs.prepare.outputs.environment }}-manual
      url: https://${{ inputs.url }}/
    steps:
      - name: Checkout ntis-devops
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          clean: true

      - name: Checkout config repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: SthapatyaConsultants/ntis-configs
          token: ${{ secrets.PAT_TOKEN }}
          path: _configs

      - name: Download, back up, deploy, verify (rolls back on failure)
        shell: powershell
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}
          PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
          VERSION: ${{ inputs.version }}
          PACKAGE_ENV: ${{ inputs.package_env }}
          TENANT_URL: ${{ inputs.url }}
          RUN_DB: ${{ inputs.run_db_migration }}
          SKIP_HEALTH: ${{ inputs.skip_health_check }}
          BACKUP_ROOT: ${{ vars.NTIS_BACKUP_ROOT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/NtisPipeline.psm1 -Force -DisableNameChecking
          Import-Module ./scripts/NtisDeploy.psm1 -Force -DisableNameChecking

          $v = $env:VERSION; $pe = $env:PACKAGE_ENV
          $tenant = Get-NtisTenant -TenantsFile '_configs/tenants.json' -Url $env:TENANT_URL
          $deployConfig = Get-NtisDeployConfig
          $work = Join-Path $env:RUNNER_TEMP "ntis-interim-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          try {
            function Get-Pkg([string] $blob, [string] $name) {
              $zip = Join-Path $work "$name.zip"
              Save-NtisBlobFile -Container $env:PACKAGE_CONTAINER -Name $blob -Path $zip
              return (Expand-NtisPackage -Zip $zip -Destination (Join-Path $work $name))
            }

            $components = @('platform', 'ui')
            $packages = @{}
            $packages['ui'] = Get-Pkg "$pe/$v/ui/ntis-ui-$pe-v$v.zip" 'ui'
            # The legacy API zip is flat; the deploy module expects <platform>\api
            $platformRoot = Join-Path $work 'platform'
            New-Item -ItemType Directory -Path $platformRoot -Force | Out-Null
            $api = Get-Pkg "$pe/$v/platform/ntis-platform-api-$pe-v$v.zip" 'api-flat'
            Move-Item $api (Join-Path $platformRoot 'api')
            $packages['platform'] = $platformRoot

            if ($env:RUN_DB -eq 'true') {
              $packages['dbmanager'] = Get-Pkg "$pe/$v/database-manager/DatabaseManager-v$v.zip" 'dbmanager'
              $components = @('dbmanager') + $components
            }

            $p = @{
              Tenant            = $tenant
              TenantEnvironment = $pe
              Components        = $components
              Packages          = $packages
              ConfigRoot        = (Resolve-Path '_configs').Path
              DeployConfig      = $deployConfig
              Stamp             = @{ version = $v; packageEnvironment = $pe; tenant = $tenant.Url; runUrl = $env:RUN_URL; deployedAt = (Get-Date).ToUniversalTime().ToString('o') }
            }
            if ($env:BACKUP_ROOT) { $p.BackupRoot = $env:BACKUP_ROOT }
            if ($env:SKIP_HEALTH -eq 'true') { $p.SkipHealthCheck = $true }
            $backup = Invoke-NtisTenantDeploy @p
            "Deployed **$v** ($pe) to **$($tenant.Url)**: $($components -join ', '). Backup: ``$backup``" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          }

      - if: always()
        shell: powershell
        run: Remove-Item _configs -Recurse -Force -ErrorAction SilentlyContinue
