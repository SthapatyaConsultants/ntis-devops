# Direct deploy of feature/rts to the LIVE Citizen site (citizen.scipl.info.in / citizenapi.scipl.info.in).
# INTERIM - kept because the site is live (design OD-4). Retired by plan task 6.3, when feature/rts is merged
# through develop -> qa -> staging -> main and Citizen becomes a normal tenant of deploy-env.yml.
#
# Phase 0 hardening: release-manager approval (production-manual), host-wide concurrency, backup before stop,
# automatic restore + restart on any failure, HTTP health check, node_modules now deployed with the build it
# belongs to (F29), .env/web.config never purged (F29), shared deploy code from scripts/NtisDeploy.psm1.
name: Direct Deploy - NTIS Citizen Feature (interim)

run-name: Deploy NTIS Citizen (feature/rts) - Run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: What is being released and why
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ntis-host-deploy
  cancel-in-progress: false

env:
  UI_BRANCH: feature/rts
  PLATFORM_BRANCH: feature/rts
  UI_DEPLOY_PATH: E:\WebApp\citizen.scipl.info.in
  API_DEPLOY_PATH: E:\WebApp\citizenapi.scipl.info.in
  UI_SERVICE_NAME: PTIS-Citizen
  API_SITE_NAME: citizenapi.scipl.info.in
  UI_HEALTH_URL: https://citizen.scipl.info.in/
  API_HEALTH_URL: ${{ vars.CITIZEN_API_HEALTH_URL }}
  BACKUP_ROOT: ${{ vars.NTIS_BACKUP_ROOT || 'C:\Backup' }}

jobs:
  deploy-ui:
    name: Build and Deploy NTIS UI
    runs-on: [self-hosted, windows, citizen-deploy]
    timeout-minutes: 60
    environment:
      name: production-manual
      url: https://citizen.scipl.info.in/
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout ntis-devops
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          clean: true

      - name: Checkout NTIS UI (${{ env.UI_BRANCH }})
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: SthapatyaConsultants/ntis-ui
          ref: ${{ env.UI_BRANCH }}
          token: ${{ secrets.PAT_TOKEN }}
          path: _ui
          clean: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _ui/package-lock.json

      - name: Install and build
        working-directory: _ui
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'package-lock.json') { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { throw 'NTIS UI dependency installation failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'NTIS UI build failed.' }
          if (-not (Test-Path '.next')) { throw 'UI build completed, but the .next folder was not found.' }

      - name: Deploy UI (backup, stop, publish, start, health - rolls back on failure)
        env:
          REASON: ${{ inputs.reason }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/NtisDeploy.psm1 -Force -DisableNameChecking
          $cfg = Get-NtisDeployConfig
          $tenant = [pscustomobject]@{ Tenant = 'citizen'; Environment = 'prod' }
          $targets = [ordered]@{ ui = $env:UI_DEPLOY_PATH }
          $backup = Backup-NtisTenant -Tenant $tenant -Targets $targets -Root $env:BACKUP_ROOT -ExcludeDirs @('Logs', 'logs')
          Write-Host "Backup: $backup"
          try {
            Stop-NtisService -Name $env:UI_SERVICE_NAME
            # Whole repo incl. the node_modules this build was made with; never purge server-side config.
            Invoke-NtisRobocopy -Source '_ui' -Destination $env:UI_DEPLOY_PATH -Mirror `
              -ExcludeFiles @('.gitignore', 'README.md', '.env', '.env.*', 'web.config') `
              -ExcludeDirs @('.git', '.github', 'Logs', 'logs') | Out-Null
            @{ branch = $env:UI_BRANCH; commitSha = (git -C _ui rev-parse HEAD); runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; reason = $env:REASON; deployedAt = (Get-Date).ToUniversalTime().ToString('o') } |
              ConvertTo-Json | Set-Content (Join-Path $env:UI_DEPLOY_PATH 'version.json') -Encoding UTF8
            Start-NtisService -Name $env:UI_SERVICE_NAME
            Test-NtisHealth -Url $env:UI_HEALTH_URL
          } catch {
            $err = $_.Exception.Message
            Write-Host "::error::UI deploy failed: $err. Restoring $backup"
            try { Stop-NtisService -Name $env:UI_SERVICE_NAME } catch { Write-Warning $_.Exception.Message }
            Restore-NtisTenant -BackupPath $backup -Targets $targets -ExcludeDirs @('Logs', 'logs')
            Start-NtisService -Name $env:UI_SERVICE_NAME
            throw "UI deploy failed and was rolled back: $err"
          }
          Remove-NtisOldBackups -Root $env:BACKUP_ROOT -Tenant $tenant -Keep 5
          "UI deployed from ``$env:UI_BRANCH`` - $env:REASON" >> $env:GITHUB_STEP_SUMMARY

  deploy-platform:
    name: Build and Deploy NTIS Platform
    needs: deploy-ui
    runs-on: [self-hosted, windows, citizen-deploy]
    timeout-minutes: 60
    environment:
      name: production-manual
      url: https://citizenapi.scipl.info.in/
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout ntis-devops
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          clean: true

      - name: Checkout NTIS Platform (${{ env.PLATFORM_BRANCH }})
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: SthapatyaConsultants/ntis-platform
          ref: ${{ env.PLATFORM_BRANCH }}
          token: ${{ secrets.PAT_TOKEN }}
          path: _platform
          clean: true
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore, build, publish
        working-directory: _platform
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore
          if ($LASTEXITCODE -ne 0) { throw 'NTIS Platform restore failed.' }
          dotnet build --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'NTIS Platform build failed.' }
          $publishPath = Join-Path $env:RUNNER_TEMP "NTIS-Platform-Publish-$env:GITHUB_RUN_ID"
          if (Test-Path $publishPath) { Remove-Item $publishPath -Recurse -Force }
          dotnet publish --configuration Release --no-build --output $publishPath
          if ($LASTEXITCODE -ne 0) { throw 'NTIS Platform publish failed.' }
          if (-not (Get-ChildItem $publishPath -Recurse -File | Select-Object -First 1)) { throw 'NTIS Platform publish folder is empty.' }
          "API_PUBLISH_PATH=$publishPath" >> $env:GITHUB_ENV

      - name: Deploy Platform (backup, stop, publish, start, health - rolls back on failure)
        env:
          REASON: ${{ inputs.reason }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/NtisDeploy.psm1 -Force -DisableNameChecking
          $tenant = [pscustomobject]@{ Tenant = 'citizenapi'; Environment = 'prod' }
          $targets = [ordered]@{ api = $env:API_DEPLOY_PATH }
          $keepDirs = @('Uploads', 'uploads', 'Logs', 'logs')
          $backup = Backup-NtisTenant -Tenant $tenant -Targets $targets -Root $env:BACKUP_ROOT -ExcludeDirs $keepDirs
          Write-Host "Backup: $backup"
          try {
            Stop-NtisApiSite -Site $env:API_SITE_NAME
            Publish-NtisFolder -Source $env:API_PUBLISH_PATH -Destination $env:API_DEPLOY_PATH `
              -PreserveFiles @('appsettings.json', 'appsettings.*.json', 'web.config') -PreserveDirs $keepDirs
            @{ branch = $env:PLATFORM_BRANCH; commitSha = (git -C _platform rev-parse HEAD); runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; reason = $env:REASON; deployedAt = (Get-Date).ToUniversalTime().ToString('o') } |
              ConvertTo-Json | Set-Content (Join-Path $env:API_DEPLOY_PATH 'version.json') -Encoding UTF8
            Start-NtisApiSite -Site $env:API_SITE_NAME
            if ($env:API_HEALTH_URL) { Test-NtisHealth -Url $env:API_HEALTH_URL } else { Write-Warning 'CITIZEN_API_HEALTH_URL not set; API health not checked.' }
            Test-NtisHealth -Url $env:UI_HEALTH_URL
          } catch {
            $err = $_.Exception.Message
            Write-Host "::error::Platform deploy failed: $err. Restoring $backup"
            try { Stop-NtisApiSite -Site $env:API_SITE_NAME } catch { Write-Warning $_.Exception.Message }
            Restore-NtisTenant -BackupPath $backup -Targets $targets -ExcludeDirs $keepDirs
            Start-NtisApiSite -Site $env:API_SITE_NAME
            throw "Platform deploy failed and was rolled back: $err"
          } finally {
            Remove-Item $env:API_PUBLISH_PATH -Recurse -Force -ErrorAction SilentlyContinue
          }
          Remove-NtisOldBackups -Root $env:BACKUP_ROOT -Tenant $tenant -Keep 5
          "Platform deployed from ``$env:PLATFORM_BRANCH`` - $env:REASON" >> $env:GITHUB_STEP_SUMMARY
