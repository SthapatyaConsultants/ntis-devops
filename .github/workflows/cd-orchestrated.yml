name: CD Deploy - Orchestrated OnPrem

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
  CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}

jobs:
  deploy:
    name: Test Package Download
    runs-on: [self-hosted, cd, ntis]

    steps:

    - name: Set Environment Config
      shell: powershell
      run: |
        $envName = "${{ github.event.inputs.environment }}"
        Write-Host "Environment selected: $envName"

    - name: Prepare directories
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "C:\Deploy"

    - name: Download Package
      shell: powershell
      run: |
        $v = "${{ github.event.inputs.version }}"
        $envName = "${{ github.event.inputs.environment }}"

        Write-Host "Downloading from: $envName/$v/package.zip"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$envName/$v/package.zip" `
          --file "C:\Deploy\package.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    - name: Extract Package
      shell: powershell
      run: |
        Expand-Archive "C:\Deploy\package.zip" -DestinationPath "C:\Deploy\app" -Force

   
