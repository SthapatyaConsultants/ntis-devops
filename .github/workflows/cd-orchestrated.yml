name: Full Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
  CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}

jobs:
  deploy:
    name: Deploy NTIS (API + DB + UI)
    runs-on: [self-hosted, cd, ntis]

    steps:

    # 🔹 1. Environment Info
    - name: Set Environment Config
      shell: pwsh
      run: |
        $envName = "${{ github.event.inputs.environment }}"
        $version = "${{ github.event.inputs.version }}"
        Write-Host "Environment: $envName"
        Write-Host "Version: $version"

    # 🔹 2. Prepare directories
    - name: Prepare directories
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "C:\Deploy"
        New-Item -ItemType Directory -Force -Path "C:\Backup"

    # 🔹 3. Download UI
    - name: Download UI Package
      shell: pwsh
      run: |
        $v="${{ github.event.inputs.version }}"
        $envName="${{ github.event.inputs.environment }}"

        $fileName="ntis-ui-$envName-v$v.zip"
        $blobPath="$envName/$v/ui/$fileName"

        Write-Host "Downloading UI from: $blobPath"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blobPath" `
          --file "C:\Deploy\ui.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 4. Download API
    - name: Download API Package
      shell: pwsh
      run: |
        $v="${{ github.event.inputs.version }}"
        $envName="${{ github.event.inputs.environment }}"

        $fileName="ntis-platform-api-$envName-v$v.zip"
        $blobPath="$envName/$v/platform/$fileName"

        Write-Host "Downloading API from: $blobPath"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blobPath" `
          --file "C:\Deploy\api.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 5. Download DB
    - name: Download DB Package
      shell: pwsh
      run: |
        $v="${{ github.event.inputs.version }}"
        $envName="${{ github.event.inputs.environment }}"

        $fileName="DatabaseManager-v$v.zip"
        $blobPath="$envName/$v/database-manager/$fileName"

        Write-Host "Downloading DB from: $blobPath"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blobPath" `
          --file "C:\Deploy\db.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 6. Extract Packages
    - name: Extract Packages
      shell: pwsh
      run: |
        Expand-Archive "C:\Deploy\ui.zip" -DestinationPath "C:\Deploy\ui" -Force
        Expand-Archive "C:\Deploy\api.zip" -DestinationPath "C:\Deploy\api" -Force

        if (Test-Path "C:\Deploy\db.zip") {
          Expand-Archive "C:\Deploy\db.zip" -DestinationPath "C:\Deploy\db" -Force
        }

    # 🔴 7. Stop API IIS
    - name: Stop API IIS Site
      shell: pwsh
      run: |
        Import-Module WebAdministration
        Stop-WebSite -Name "ptisapi.scipl.info.in"

    # 💾 8. Backup API
    - name: Backup API
      shell: pwsh
      run: |
        $time = Get-Date -Format yyyyMMddHHmmss
        $backupPath = "C:\Backup\api_$time"

        New-Item -ItemType Directory -Force -Path $backupPath

        robocopy "E:\WebApp\ptisapi.scipl.info.in" $backupPath /MIR

        if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

    # 🚀 9. Deploy API
    - name: Deploy API
      shell: pwsh
      run: |
        robocopy "C:\Deploy\api" "E:\WebApp\ptisapi.scipl.info.in" /MIR /XF "appsettings*.json"

        if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

    # 🟢 10. Start API
    - name: Start API IIS Site
      shell: pwsh
      run: |
        Import-Module WebAdministration
        Start-WebSite -Name "ptisapi.scipl.info.in"

    # 🧠 11. Copy DB Config
    - name: Copy DB Config
      shell: pwsh
      run: |
        Copy-Item "C:\appsettings.json" "C:\Deploy\db\win-x64\appsettings.json" -Force

    # 🚀 12. Run DB Migration
    - name: Run Database Manager
      shell: pwsh
      run: |
        cmd /c "echo C | `"C:\Deploy\db\win-x64\DatabaseManager.exe`""

    # 💾 13. Backup UI
    - name: Backup UI
      shell: pwsh
      run: |
        $time = Get-Date -Format yyyyMMddHHmmss
        $backupPath = "C:\Backup\ui_$time"

        New-Item -ItemType Directory -Force -Path $backupPath

        robocopy "E:\WebApp\ptis.scipl.info.in" $backupPath /MIR

        if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

    # 🚀 14. Deploy UI
    - name: Deploy UI
      shell: pwsh
      run: |
        robocopy "C:\Deploy\ui" "E:\WebApp\ptis.scipl.info.in" /MIR

        if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

    # 🚀 15. Start UI (Node)
    - name: Start UI Server
      shell: pwsh
      run: |
        cd "E:\WebApp\ptis.scipl.info.in"

        Write-Host "Starting UI on port 3003..."

        Start-Process "cmd.exe" -ArgumentList "/c npm start" -WindowStyle Hidden
