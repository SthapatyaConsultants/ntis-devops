name: Full Deployment Pipeline 

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

      url:
        description: 'UI URL (example: ptis.scipl.info.in)'
        required: true
        type: string

env:
  PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
  CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}

jobs:

  # 🔹 1. PREPARE (Parse URL + Setup)
  prepare:
    name: 🔹 Prepare Environment
    runs-on: [self-hosted, cd, ntis]

    outputs:
      ENV_NAME: ${{ steps.parse.outputs.env }}
      TENANT_NAME: ${{ steps.parse.outputs.tenant }}
      API_SITE: ${{ steps.parse.outputs.api_site }}
      API_PATH: ${{ steps.parse.outputs.api_path }}
      UI_PATH: ${{ steps.parse.outputs.ui_path }}
      UI_SERVICE: ${{ steps.parse.outputs.ui_service }}

    steps:
      - name: Parse URL
        id: parse
        shell: pwsh
        run: |
          $url="${{ github.event.inputs.url }}".ToLower()
          $sub = $url.Split('.')[0]

          if ($sub -match "-dev$") {
            $envName="dev"
            $tenantName = $sub -replace "-dev$",""
          }
          elseif ($sub -match "-qa$") {
            $envName="qa"
            $tenantName = $sub -replace "-qa$",""
          }
          else {
            $envName="prod"
            $tenantName = $sub
          }

          if ($envName -eq "prod") {
            $apiSite = "$tenantName-api"
            $apiPath = "E:\WebApp\$tenantName-api"
            $uiPath  = "E:\WebApp\$tenantName"
            $uiService = "$tenantName-ui"
          } else {
            $apiSite = "$tenantName-api-$envName"
            $apiPath = "E:\WebApp\$tenantName-api-$envName"
            $uiPath  = "E:\WebApp\$tenantName-$envName"
            $uiService = "$tenantName-ui-$envName"
          }

          echo "env=$envName" >> $env:GITHUB_OUTPUT
          echo "tenant=$tenantName" >> $env:GITHUB_OUTPUT
          echo "api_site=$apiSite" >> $env:GITHUB_OUTPUT
          echo "api_path=$apiPath" >> $env:GITHUB_OUTPUT
          echo "ui_path=$uiPath" >> $env:GITHUB_OUTPUT
          echo "ui_service=$uiService" >> $env:GITHUB_OUTPUT

          Write-Host "Tenant: $tenantName"
          Write-Host "Environment: $envName"

  # 🔹 2. DOWNLOAD PACKAGES
  download:
    name: 📦 Download Packages
    needs: prepare
    runs-on: [self-hosted, cd, ntis]

    steps:
      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Deploy" | Out-Null

      - name: Download UI
        shell: pwsh
        run: |
          $v="${{ github.event.inputs.version }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"
          $file="ntis-ui-$envName-v$v.zip"
          $blob="$envName/$v/ui/$file"

          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$blob" `
            --file "C:\Deploy\ui.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

      - name: Download API
        shell: pwsh
        run: |
          $v="${{ github.event.inputs.version }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"
          $file="ntis-platform-api-$envName-v$v.zip"
          $blob="$envName/$v/platform/$file"

          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$blob" `
            --file "C:\Deploy\api.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

      - name: Download DB
        shell: pwsh
        run: |
          $v="${{ github.event.inputs.version }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"
          $file="DatabaseManager-v$v.zip"
          $blob="$envName/$v/database-manager/$file"

          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$blob" `
            --file "C:\Deploy\db.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

      - name: Extract Packages
        shell: pwsh
        run: |
          Expand-Archive "C:\Deploy\ui.zip" -DestinationPath "C:\Deploy\ui" -Force
          Expand-Archive "C:\Deploy\api.zip" -DestinationPath "C:\Deploy\api" -Force
          Expand-Archive "C:\Deploy\db.zip" -DestinationPath "C:\Deploy\db" -Force

  # 🔹 3. STOP + BACKUP
  stop-backup:
    name: 🔴 Stop Services & Backup
    needs: [prepare, download]
    runs-on: [self-hosted, cd, ntis]

    steps:
      - name: Stop API (Force)
        shell: pwsh
        run: |
          Import-Module WebAdministration
          $site="${{ needs.prepare.outputs.API_SITE }}"

          if (Get-Website | Where-Object { $_.Name -eq $site }) {
            Stop-Website -Name $site
            Stop-WebAppPool -Name $site -ErrorAction SilentlyContinue
            Write-Host "API stopped: $site"
          } else {
            Write-Host "API site not found"
          }

      - name: Stop UI Service
        shell: pwsh
        run: |
          $svc="${{ needs.prepare.outputs.UI_SERVICE }}"
          $service = Get-Service -Name $svc -ErrorAction SilentlyContinue

          if ($service -and $service.Status -ne "Stopped") {
            sc stop $svc
            Write-Host "UI stopped: $svc"
          }

      - name: Backup API & UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Backup" | Out-Null

          $tenant="${{ needs.prepare.outputs.TENANT_NAME }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"
          $date=Get-Date -Format "yyyy-MM-dd"
          $time=Get-Date -Format "HH-mm-ss"

          $base="C:\Backup\$tenant\$envName\$date\$time"
          $apiBackup="$base\api"
          $uiBackup="$base\ui"

          New-Item -ItemType Directory -Force -Path $apiBackup | Out-Null
          New-Item -ItemType Directory -Force -Path $uiBackup | Out-Null

          robocopy "${{ needs.prepare.outputs.API_PATH }}" $apiBackup /MIR
          robocopy "${{ needs.prepare.outputs.UI_PATH }}" $uiBackup /MIR

          exit 0

  # 🔹 4. DEPLOY
  deploy:
    name: 🚀 Deploy Application
    needs: stop-backup
    runs-on: [self-hosted, cd, ntis]

    steps:
      - name: Deploy API
        shell: pwsh
        run: |
          robocopy "C:\Deploy\api" "${{ needs.prepare.outputs.API_PATH }}" /MIR /XF "appsettings*.json"
          if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

      - name: Deploy UI
        shell: pwsh
        run: |
          robocopy "C:\Deploy\ui" "${{ needs.prepare.outputs.UI_PATH }}" /MIR /XF "web.config"
          if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

  # 🔹 5. CONFIG + DB
  configure:
    name: 🧠 Apply Config & DB Migration
    needs: deploy
    runs-on: [self-hosted, cd, ntis]

    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          repository: SthapatyaConsultants/ntis-configs
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: ntis-configs

      - name: Apply Configs
        shell: pwsh
        run: |
          $tenant="${{ needs.prepare.outputs.TENANT_NAME }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"
          $base="ntis-configs/tenants/$tenant/$envName"

          Copy-Item "$base/platform/appsettings.Api.Production.json" "${{ needs.prepare.outputs.API_PATH }}\appsettings.Production.json" -Force

          if (Test-Path "$base/platform/appsettings.Worker.Production.json") {
            Copy-Item "$base/platform/appsettings.Worker.Production.json" "${{ needs.prepare.outputs.API_PATH }}\appsettings.Worker.json" -Force
          }

          Copy-Item "$base/database-manager/appsettings.json" "C:\Deploy\db\win-x64\appsettings.json" -Force
          Copy-Item "$base/ui/.env.production" "${{ needs.prepare.outputs.UI_PATH }}\.env" -Force

      - name: Run DB Migration
        shell: pwsh
        run: |
          cmd /c "echo C | `"C:\Deploy\db\win-x64\DatabaseManager.exe`""

  # 🔹 6. START SERVICES
  start:
    name: 🟢 Start Services
    needs: configure
    runs-on: [self-hosted, cd, ntis]

    steps:
      - name: Start API
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Start-Website -Name "${{ needs.prepare.outputs.API_SITE }}"

      - name: Start UI Service
        shell: pwsh
        run: |
          sc start "${{ needs.prepare.outputs.UI_SERVICE }}"
