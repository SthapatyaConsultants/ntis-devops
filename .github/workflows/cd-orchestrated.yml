name: Full Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

      url:
        description: 'UI URL (example: ptis.scipl.info.in)'
        required: true
        type: string

env:
  PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
  CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}

jobs:

# 🔹 1. PREPARE
  prepare:
    name: 🔹 Prepare
    runs-on: [self-hosted, cd, ntis]

    outputs:
      ENV_NAME: ${{ steps.parse.outputs.env }}
      TENANT_NAME: ${{ steps.parse.outputs.tenant }}
      API_SITE: ${{ steps.parse.outputs.api_site }}
      API_PATH: ${{ steps.parse.outputs.api_path }}
      UI_PATH: ${{ steps.parse.outputs.ui_path }}
      UI_SERVICE: ${{ steps.parse.outputs.ui_service }}

    steps:
      - name: Parse URL
        id: parse
        shell: powershell
        run: |

          $url="${{ github.event.inputs.url }}".ToLower()
          $sub = $url.Split('.')[0]

          if ($sub -match "-dev$") {
            $envName="dev"
            $tenantName = $sub -replace "-dev$",""
          }
          elseif ($sub -match "-qa$") {
            $envName="qa"
            $tenantName = $sub -replace "-qa$",""
          }
          else {
            $envName="prod"
            $tenantName = $sub
          }

          # PROD
          if ($envName -eq "prod") {

            $apiSite = "$tenantName-api"
            $apiPath = "E:\WebApp\$tenantName-api"

            $uiPath  = "E:\WebApp\$tenantName"
            $uiService = "$tenantName-ui"

          }
          else {

            # QA / DEV
            $apiSite = "$tenantName-api-$envName"
            $apiPath = "E:\WebApp\$tenantName-api-$envName"

            $uiPath  = "E:\WebApp\$tenantName-$envName"
            $uiService = "$tenantName-ui-$envName"
          }

          echo "env=$envName" >> $env:GITHUB_OUTPUT
          echo "tenant=$tenantName" >> $env:GITHUB_OUTPUT
          echo "api_site=$apiSite" >> $env:GITHUB_OUTPUT
          echo "api_path=$apiPath" >> $env:GITHUB_OUTPUT
          echo "ui_path=$uiPath" >> $env:GITHUB_OUTPUT
          echo "ui_service=$uiService" >> $env:GITHUB_OUTPUT

          Write-Host "================================="
          Write-Host "Environment : $envName"
          Write-Host "Tenant      : $tenantName"
          Write-Host "API Site    : $apiSite"
          Write-Host "API Path    : $apiPath"
          Write-Host "UI Service  : $uiService"
          Write-Host "UI Path     : $uiPath"
          Write-Host "================================="


# 🔹 2. DOWNLOAD
  download:
    name: 📦 Download Packages
    needs: prepare
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Prepare Deploy Folder
        shell: powershell
        run: |

          Remove-Item "C:\Deploy" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "C:\Deploy" | Out-Null

      - name: Download Packages
        shell: powershell
        run: |

          $v="${{ github.event.inputs.version }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"

          # UI
          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$envName/$v/ui/ntis-ui-$envName-v$v.zip" `
            --file "C:\Deploy\ui.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

          # API
          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$envName/$v/platform/ntis-platform-api-$envName-v$v.zip" `
            --file "C:\Deploy\api.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

          # DB
          az storage blob download `
            --container-name "${{ env.PACKAGE_CONTAINER }}" `
            --name "$envName/$v/database-manager/DatabaseManager-v$v.zip" `
            --file "C:\Deploy\db.zip" `
            --connection-string "${{ env.CONNECTION_STRING }}" `
            --overwrite

      - name: Extract Packages
        shell: powershell
        run: |

          Expand-Archive `
            "C:\Deploy\ui.zip" `
            -DestinationPath "C:\Deploy\ui" `
            -Force

          Expand-Archive `
            "C:\Deploy\api.zip" `
            -DestinationPath "C:\Deploy\api" `
            -Force

          Expand-Archive `
            "C:\Deploy\db.zip" `
            -DestinationPath "C:\Deploy\db" `
            -Force


# 🔹 3. STOP + BACKUP
  stop-backup:
    name: 🛑 Stop Services & Backup
    needs: [prepare, download]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Stop API Website & AppPool
        shell: powershell
        run: |

          Import-Module WebAdministration

          $site = "${{ needs.prepare.outputs.API_SITE }}"

          Write-Host "Stopping Website : $site"

          if (Get-Website | Where-Object { $_.Name -eq $site }) {

            Stop-Website -Name $site

            Write-Host "Website stopped"

            Start-Sleep 5

            # Get Actual AppPool Name
            $pool = (Get-Item "IIS:\Sites\$site").applicationPool

            Write-Host "AppPool : $pool"

            if ($pool) {

              Stop-WebAppPool -Name $pool

              Write-Host "AppPool stopped"

            }

          }
          else {

            Write-Error "Website not found : $site"
            exit 1

          }

      - name: Stop UI Service
        shell: powershell
        run: |

          $svc = "${{ needs.prepare.outputs.UI_SERVICE }}"

          $service = Get-Service `
            -Name $svc `
            -ErrorAction SilentlyContinue

          if ($service) {

            if ($service.Status -ne "Stopped") {

              sc stop $svc

              Start-Sleep 5

              Write-Host "UI Service stopped : $svc"

            }
            else {

              Write-Host "UI Service already stopped"

            }

          }
          else {

            Write-Host "UI Service not found : $svc"

          }

      - name: Backup Existing Files
        shell: powershell
        run: |

          $tenant="${{ needs.prepare.outputs.TENANT_NAME }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"

          $date = Get-Date -Format "yyyy-MM-dd"
          $time = Get-Date -Format "HH-mm-ss"

          $backupRoot = "C:\Backup\$tenant\$envName\$date\$time"

          $apiFolderName = Split-Path "${{ needs.prepare.outputs.API_PATH }}" -Leaf
          $uiFolderName  = Split-Path "${{ needs.prepare.outputs.UI_PATH }}" -Leaf

          $apiBackup = "$backupRoot\$apiFolderName"
          $uiBackup  = "$backupRoot\$uiFolderName"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $apiBackup | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $uiBackup | Out-Null

          Write-Host "Backup Path : $backupRoot"

          robocopy `
            "${{ needs.prepare.outputs.API_PATH }}" `
            $apiBackup `
            /MIR

          robocopy `
            "${{ needs.prepare.outputs.UI_PATH }}" `
            $uiBackup `
            /MIR

          exit 0


# 🔹 4. DEPLOY
  deploy:
    name: 🚀 Deploy
    needs: [prepare, stop-backup]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Create Target Folders
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ needs.prepare.outputs.API_PATH }}" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ needs.prepare.outputs.UI_PATH }}" | Out-Null

      - name: Deploy API
        shell: powershell
        run: |

          robocopy `
            "C:\Deploy\api" `
            "${{ needs.prepare.outputs.API_PATH }}" `
            /E `
            /XF "appsettings*.json" `
            /XD "Uploads"

          if ($LASTEXITCODE -le 3) {

            Write-Host "API Deploy Success"
            exit 0

          }
          else {

            exit $LASTEXITCODE

          }

      - name: Deploy UI
        shell: powershell
        run: |

          robocopy `
            "C:\Deploy\ui" `
            "${{ needs.prepare.outputs.UI_PATH }}" `
            /MIR `
            /XF "web.config"

          if ($LASTEXITCODE -le 3) {

            Write-Host "UI Deploy Success"
            exit 0

          }
          else {

            exit $LASTEXITCODE

          }


# 🔹 5. CONFIGURE
  configure:
    name: ⚙️ Configure & DB Migration
    needs: [prepare, deploy]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          repository: SthapatyaConsultants/ntis-configs
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: ntis-configs

      - name: Apply Config Files
        shell: powershell
        run: |

          $tenant="${{ needs.prepare.outputs.TENANT_NAME }}"
          $envName="${{ needs.prepare.outputs.ENV_NAME }}"

          $base="ntis-configs/tenants/$tenant/$envName"

          # API Config
          Copy-Item `
            "$base/platform/appsettings.Api.Production.json" `
            "${{ needs.prepare.outputs.API_PATH }}\appsettings.Production.json" `
            -Force

          # Worker Config
          if (Test-Path "$base/platform/appsettings.Worker.Production.json") {

            Copy-Item `
              "$base/platform/appsettings.Worker.Production.json" `
              "${{ needs.prepare.outputs.API_PATH }}\appsettings.Worker.json" `
              -Force
          }

          # UI Config
          Copy-Item `
            "$base/ui/.env.production" `
            "${{ needs.prepare.outputs.UI_PATH }}\.env" `
            -Force

          # DB Config
          Copy-Item `
            "$base/database-manager/appsettings.json" `
            "C:\Deploy\db\win-x64\appsettings.json" `
            -Force

      - name: Run DB Migration
        shell: powershell
        run: |

          # U = Upgrade Existing DB
          cmd /c "echo U | `"C:\Deploy\db\win-x64\DatabaseManager.exe`""


# 🔹 6. START
  start:
    name: 🟢 Start Services
    needs: [prepare, configure]
    runs-on: [self-hosted, cd, ntis]

    steps:

      - name: Start API Website & AppPool
        shell: powershell
        run: |

          Import-Module WebAdministration

          $site = "${{ needs.prepare.outputs.API_SITE }}"

          Write-Host "Website : $site"

          if (Get-Website | Where-Object { $_.Name -eq $site }) {

            # Get Actual AppPool Name
            $pool = (Get-Item "IIS:\Sites\$site").applicationPool

            Write-Host "AppPool : $pool"

            if ($pool) {

              $poolState = (Get-WebAppPoolState -Name $pool).Value

              if ($poolState -ne "Started") {

                Start-WebAppPool -Name $pool

                Write-Host "AppPool started"

              }
              else {

                Write-Host "AppPool already running"

              }

            }

            Start-Sleep 5

            $siteState = (Get-Website -Name $site).State

            if ($siteState -ne "Started") {

              Start-Website -Name $site

              Write-Host "Website started"

            }
            else {

              Write-Host "Website already running"

            }

          }
          else {

            Write-Error "Website not found : $site"
            exit 1

          }

      - name: Start UI Service
        shell: powershell
        run: |

          $svc="${{ needs.prepare.outputs.UI_SERVICE }}"

          $service = Get-Service `
            -Name $svc `
            -ErrorAction SilentlyContinue

          if ($service) {

            if ($service.Status -ne "Running") {

              sc start $svc

              Write-Host "UI Service started : $svc"

            }
            else {

              Write-Host "UI Service already running"

            }

          }
          else {

            Write-Error "UI Service not found : $svc"
            exit 1

          }
