name: Full Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

      url:
        description: 'UI URL (example: ptis.scipl.info.in)'
        required: true
        type: string

env:
  PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
  CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}

jobs:
  deploy:
    runs-on: [self-hosted, cd, ntis]

    steps:

    # 🔹 1. Parse URL → Tenant + Env
    - name: Parse URL
      shell: pwsh
      run: |
        $url="${{ github.event.inputs.url }}".ToLower()

        # Detect environment
        if ($url -match "dev") { $envName="dev" }
        elseif ($url -match "qa") { $envName="qa" }
        else { $envName="prod" }

        # Extract tenant (first part before dot)
        $tenantName = $url.Split('.')[0]

        echo "ENV_NAME=$envName" >> $env:GITHUB_ENV
        echo "TENANT_NAME=$tenantName" >> $env:GITHUB_ENV

        echo "API_SITE=$tenantName-api" >> $env:GITHUB_ENV
        echo "API_PATH=E:\WebApp\$tenantName-api" >> $env:GITHUB_ENV
        echo "UI_PATH=E:\WebApp\$tenantName" >> $env:GITHUB_ENV
        echo "UI_SERVICE=$tenantName-ui" >> $env:GITHUB_ENV

        Write-Host "Tenant: $tenantName"
        Write-Host "Environment: $envName"

    # 🔹 2. Checkout Config Repo
    - name: Checkout Config Repo
      uses: actions/checkout@v4
      with:
        repository: SthapatyaConsultants/ntis-configs  
        token: ${{ secrets.GITHUB_TOKEN }}
        path: ntis-configs

    # 🔹 3. Prepare folders
    - name: Prepare directories
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "C:\Deploy"
        New-Item -ItemType Directory -Force -Path "C:\Backup"

    # 🔹 4. Download UI
    - name: Download UI
      shell: pwsh
      run: |
        $v="${{ github.event.inputs.version }}"
        $envName="$env:ENV_NAME"

        $file="ntis-ui-$envName-v$v.zip"
        $blob="$envName/$v/ui/$file"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blob" `
          --file "C:\Deploy\ui.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 5. Download API
    - name: Download API
      shell: pwsh
      run: |
        $v="${{ github.event.inputs.version }}"
        $envName="$env:ENV_NAME"

        $file="ntis-platform-api-$envName-v$v.zip"
        $blob="$envName/$v/platform/$file"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blob" `
          --file "C:\Deploy\api.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 6. Download DB
    - name: Download DB
      shell: pwsh
      run: |
        $v="${{ github.event.inputs.version }}"
        $envName="$env:ENV_NAME"

        $file="DatabaseManager-v$v.zip"
        $blob="$envName/$v/database-manager/$file"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blob" `
          --file "C:\Deploy\db.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 7. Extract
    - name: Extract Packages
      shell: pwsh
      run: |
        Expand-Archive "C:\Deploy\ui.zip" -DestinationPath "C:\Deploy\ui" -Force
        Expand-Archive "C:\Deploy\api.zip" -DestinationPath "C:\Deploy\api" -Force
        Expand-Archive "C:\Deploy\db.zip" -DestinationPath "C:\Deploy\db" -Force

    # 🔴 8. Stop Services
    - name: Stop API
      shell: pwsh
      run: |
        Import-Module WebAdministration
        Stop-WebSite -Name "$env:API_SITE"

    - name: Stop UI Service
      shell: pwsh
      run: |
        sc stop $env:UI_SERVICE

    # 💾 9. Backup
    - name: Backup API & UI
      shell: pwsh
      run: |
        $t = Get-Date -Format yyyyMMddHHmmss

        robocopy "$env:API_PATH" "C:\Backup\api_$t" /MIR
        robocopy "$env:UI_PATH" "C:\Backup\ui_$t" /MIR

    # 🚀 10. Deploy
    - name: Deploy API
      shell: pwsh
      run: |
        robocopy "C:\Deploy\api" "$env:API_PATH" /MIR /XF "appsettings*.json"

    - name: Deploy UI
      shell: pwsh
      run: |
        robocopy "C:\Deploy\ui" "$env:UI_PATH" /MIR /XF "web.config"

    # 🧠 11. Apply Tenant Configs
    - name: Apply Configs
      shell: pwsh
      run: |
        $tenant="$env:TENANT_NAME"
        $envName="$env:ENV_NAME"

        $base="ntis-configs/tenants/$tenant/$envName"

        Copy-Item "$base/platform/appsettings.Api.Production.json" "$env:API_PATH\appsettings.Production.json" -Force
        Copy-Item "$base/platform/appsettings.Worker.Production.json" "$env:API_PATH\appsettings.Worker.json" -Force
        Copy-Item "$base/database-manager/appsettings.json" "C:\Deploy\db\win-x64\appsettings.json" -Force
        Copy-Item "$base/ui/.env.production" "$env:UI_PATH\.env" -Force

    # 🚀 12. Run DB Migration 
    - name: Run DB Migration
      shell: pwsh
      run: |
        cmd /c "echo C | `"C:\Deploy\db\win-x64\DatabaseManager.exe`""

    # 🟢 13. Start Services
    - name: Start API
      shell: pwsh
      run: |
        Import-Module WebAdministration
        Start-WebSite -Name "$env:API_SITE"

    - name: Start UI Service
      shell: pwsh
      run: |
        sc start $env:UI_SERVICE
