name: CD Deploy - Orchestrated OnPrem

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty for latest)'
        required: false
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  PACKAGE_CONTAINER: ${{ vars.PACKAGE_CONTAINER_NAME }}
  CONNECTION_STRING: ${{ secrets.PACKAGE_CONNECTION_STRING }}

jobs:
  deploy:
    name: Deploy NTIS Packages
    runs-on: [self-hosted, cd, ntis]

    steps:

    # 🔹 1. Environment Info
    - name: Set Environment Config
      shell: powershell
      run: |
        $envName = "${{ github.event.inputs.environment }}"
        Write-Host "Environment selected: $envName"

    # 🔹 2. Prepare directories
    - name: Prepare directories
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "C:\Deploy"
        New-Item -ItemType Directory -Force -Path "C:\Backup"

    # 🔹 3. Resolve Version
    - name: Resolve Version
      id: resolve
      shell: powershell
      run: |
        $inputVersion = "${{ github.event.inputs.version }}"
        $envName = "${{ github.event.inputs.environment }}"

        if ($inputVersion -and $inputVersion -ne "latest") {
            $finalVersion = $inputVersion
        }
        else {
            $versions = az storage blob list `
              --container-name "${{ env.PACKAGE_CONTAINER }}" `
              --connection-string "${{ env.CONNECTION_STRING }}" `
              --query "[?starts_with(name, '$envName/')].name" `
              --output tsv

            $versionList = $versions |
              ForEach-Object { ($_ -split '/')[1] } |
              Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object -Unique

            $finalVersion = $versionList |
              Sort-Object {[version]$_} -Descending |
              Select-Object -First 1

            if (-not $finalVersion) {
              Write-Error "No versions found in $envName"
              exit 1
            }
        }

        echo "version=$finalVersion" >> $env:GITHUB_OUTPUT

    # 🔹 4. Download UI
    - name: Download UI Package
      shell: powershell
      run: |
        $v="${{ steps.resolve.outputs.version }}"
        $envName="${{ github.event.inputs.environment }}"
        $fileName="ntis-ui-$envName-v$v.zip"
        $blobPath="$envName/$v/ui/$fileName"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blobPath" `
          --file "C:\Deploy\ui.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 5. Download API
    - name: Download API Package
      shell: powershell
      run: |
        $v="${{ steps.resolve.outputs.version }}"
        $envName="${{ github.event.inputs.environment }}"
        $fileName="ntis-platform-api-$envName-v$v.zip"
        $blobPath="$envName/$v/platform/$fileName"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blobPath" `
          --file "C:\Deploy\api.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 6. Download DB
    - name: Download DB Package
      shell: powershell
      run: |
        $v="${{ steps.resolve.outputs.version }}"
        $envName="${{ github.event.inputs.environment }}"
        $fileName="DatabaseManager-v$v.zip"
        $blobPath="$envName/$v/database-manager/$fileName"

        az storage blob download `
          --container-name "${{ env.PACKAGE_CONTAINER }}" `
          --name "$blobPath" `
          --file "C:\Deploy\db.zip" `
          --connection-string "${{ env.CONNECTION_STRING }}" `
          --overwrite

    # 🔹 7. Extract
    - name: Extract Packages
      shell: powershell
      run: |
        Expand-Archive "C:\Deploy\ui.zip" -DestinationPath "C:\Deploy\ui" -Force
        Expand-Archive "C:\Deploy\api.zip" -DestinationPath "C:\Deploy\api" -Force

        if (Test-Path "C:\Deploy\db.zip") {
          Expand-Archive "C:\Deploy\db.zip" -DestinationPath "C:\Deploy\db" -Force
        }

    # 🔴 8. Stop IIS
    - name: Stop API IIS Site
      shell: powershell
      run: |
        Import-Module WebAdministration
        Stop-WebSite -Name "ptisapi.scipl.info.in"

    # 💾 9. Backup 
    - name: Backup Existing API
      shell: powershell
      run: |
        $time = Get-Date -Format yyyyMMddHHmmss
        $backupPath = "C:\Backup\api_$time"

        New-Item -ItemType Directory -Force -Path $backupPath

        robocopy "E:\WebApp\ptisapi.scipl.info.in" $backupPath /MIR

        $rc = $LASTEXITCODE
        Write-Host "Backup Exit Code: $rc"

        if ($rc -le 3) {
            Write-Host "Backup SUCCESS"
            exit 0
        } else {
            Write-Error "Backup FAILED"
            exit $rc
        }

    # 🚀 10. Deploy API 
    - name: Deploy API Files
      shell: powershell
      run: |
        $source = "C:\Deploy\api"
        $destination = "E:\WebApp\ptisapi.scipl.info.in"

        robocopy $source $destination /MIR /XF "appsettings*.json"

        $rc = $LASTEXITCODE
        Write-Host "Deploy Exit Code: $rc"

        if ($rc -le 3) {
            Write-Host "Deployment SUCCESS"
            exit 0
        } else {
            Write-Error "Deployment FAILED"
            exit $rc
        }

    # 🟢 11. Start IIS
    - name: Start API IIS Site
      shell: powershell
      run: |
        Import-Module WebAdministration
        Start-WebSite -Name "ptisapi.scipl.info.in"

    # 🧠 12. Copy DB Config
    - name: Copy DB Config
      shell: powershell
      run: |
        $sourceConfig = "C:\appsettings.json"
        $destination = "C:\Deploy\db\win-x64\appsettings.json"

        Write-Host "Copying DB config..."

        if (!(Test-Path $sourceConfig)) {
            Write-Error "Source config not found at $sourceConfig"
            exit 1
        }

        Copy-Item -Path $sourceConfig -Destination $destination -Force

        Write-Host "DB Config copied successfully"

    # 🚀 13. Run Database Manager
    - name: Run Database Migration
      shell: powershell
      run: |
        $exePath = "C:\Deploy\db\win-x64\DatabaseManager.exe"

        if (!(Test-Path $exePath)) {
            Write-Error "DatabaseManager.exe not found at $exePath"
            exit 1
        }

        Write-Host "Running DatabaseManager..."

        cmd /c "echo U | `"$exePath`""

        $rc = $LASTEXITCODE
        Write-Host "DB Exit Code: $rc"

        if ($rc -ne 0) {
            Write-Error "Database migration failed"
            exit $rc
        }

        Write-Host "Database migration completed successfully"


    # 🚀 14. Deploy UI Files
    - name: Deploy UI
      shell: powershell
      run: |
        $source = "C:\Deploy\ui"
        $destination = "E:\WebApp\ptis.scipl.info.in"

        Write-Host "Deploying UI..."

        robocopy $source $destination /MIR

        $rc = $LASTEXITCODE
        Write-Host "UI Deploy Exit Code: $rc"

        if ($rc -le 3) {
            Write-Host "UI Deployment SUCCESS"
            exit 0
        } else {
            Write-Error "UI Deployment FAILED"
            exit $rc
        }
